<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Workout Creator</title>
    <link rel="stylesheet" href="custom_workout.css">
</head>
<body>
    <div class="container">
        <h1>Custom Workout Creator</h1>
        <form id="workoutForm">
            <div class="form-group">
                <label for="templateName">Workout Name</label>
                <input type="text" id="templateName" name="templateName" required />
            </div>
            <div class="form-group">
                <label for="creatorNotes">Creator Notes</label>
                <textarea id="creatorNotes" name="creatorNotes" rows="3"></textarea>
            </div>

            <div class="exercise-section">
                <h2>Exercise Sequence</h2>
                <button type="button" id="addLibraryBtn">Add From Library</button>
                <button type="button" id="addManualBtn">Add Manually</button>

                <table id="exerciseTable">
                    <thead>
                        <tr>
                            <th>Exercise</th>
                            <th>Sets</th>
                            <th>Reps</th>
                            <th>Rest</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <button type="submit" id="saveBtn">Save Workout</button>
        </form>
    </div>

    <!-- modal -->
    <div id="libraryModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" id="modalClose">&times;</span>
            <h3>Select an Exercise</h3>
            <input type="text" id="searchInput" placeholder="Search by name, equipment, etc..." />
            <ul id="libraryList"></ul>
        </div>
    </div>

    <script src="custom_workout.js"></script>
</body>
</html>
