<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutrition Hub | Health Fitness Pro</title>
    <style>
        :root {
            --background: #0F0F0F;
            --surface: #1A1A1A;
            --surface-alt: #222222;
            --border: #333333;
            --accent: #4A90FF;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --radius: 20px;
            --success: #4AFF8C;
            --danger: #FF4A4A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: var(--background); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; }
        .container { padding: 40px 5%; max-width: 1200px; margin: 0 auto; }

        /* --- HEADER & DYNAMIC STATS --- */
        .hub-header { text-align: center; margin-bottom: 40px; }
        .hub-header h1 { font-size: 2.2rem; letter-spacing: -1.5px; margin-bottom: 20px; font-weight: 700; }
        
        .stat-strip { display: inline-flex; gap: 12px; padding: 10px; }
        .stat-pill {
            flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
            border-radius: 40px; padding: 8px 18px; font-size: 11px; font-weight: 700;
            color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
        }
        #kcalPill { border-color: var(--accent); color: var(--accent); }
        #kcalPill.over { border-color: var(--danger); color: var(--danger); }

        /* --- LAYOUT --- */
        .log-grid { display: grid; grid-template-columns: 350px 1fr; gap: 30px; align-items: start; }
        @media (max-width: 900px) { .log-grid { grid-template-columns: 1fr; } }

        .sidebar-card { background: var(--surface); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* GAUGE */
        .gauge-container { position: relative; width: 140px; height: 140px; margin: 0 auto 15px auto; }
        svg { transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: #252525; stroke-width: 10; }
        .circle-progress { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: 0.6s; }
        .gauge-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }

        /* INPUTS */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 9px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        input { background: #080808; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); }
        
        .results-area { max-height: 180px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .draggable-food { background: var(--surface-alt); padding: 12px; border-radius: 12px; font-size: 13px; cursor: grab; border: 1px solid transparent; }
        .draggable-food:hover { border-color: var(--text-secondary); }

        /* MEAL SECTIONS */
        .meal-section { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
        .meal-section.drag-over { border-color: var(--accent); background: rgba(74, 144, 255, 0.05); }
        .meal-header { padding: 15px 20px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .meal-header h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }
        .drop-zone { min-height: 100px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .drop-placeholder { color: #444; font-size: 11px; text-transform: uppercase; text-align: center; margin-top: 25px; pointer-events: none; }
        
        .logged-item { background: #080808; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s ease; }
        .remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; opacity: 0.6; }

        .btn { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        .btn-add { background: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border); margin-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="hub-header">
        <h1>Nutrition Hub</h1>
        <div class="stat-strip">
            <div class="stat-pill" id="kcalPill">TODAY: <span id="stripKcal" style="margin-left:5px">0</span> KCAL</div>
        </div>
    </div>

    <div class="log-grid">
        <div class="log-sidebar">
            <div class="sidebar-card">
                <div class="gauge-container">
                    <svg width="140" height="140"><circle class="circle-bg" cx="70" cy="70" r="62"></circle><circle id="progressCircle" class="circle-progress" cx="70" cy="70" r="62"></circle></svg>
                    <div class="gauge-text">
                        <h2 id="kcalDisplay">2500</h2>
                        <p id="gaugeSub" style="font-size: 8px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">Remaining</p>
                    </div>
                </div>
                <div class="input-group" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                    <label>Set Daily Goal (kcal)</label>
                    <input type="number" id="goalInput" value="2500" oninput="calculate()">
                </div>
            </div>

            <div class="sidebar-card">
                <div class="input-group">
                    <label>Find Food</label>
                    <input type="text" id="foodSearch" placeholder="Search..." oninput="updateSearch()">
                </div>
                <div class="results-area" id="searchRes"></div>
                
                <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <label>Quick Custom Log</label>
                    <input type="text" id="customName" placeholder="Food Name" style="margin-bottom: 8px;">
                    <input type="number" id="customKcal" placeholder="Calories">
                    <button class="btn btn-add" onclick="addCustom()">Add to Results</button>
                </div>
            </div>
        </div>

        <div class="log-main">
            <div class="meal-section" id="box-breakfast" ondragover="hOver(event)" ondragleave="hLeave(event)" ondrop="hDrop(event, 'breakfast')">
                <div class="meal-header"><h4>Breakfast</h4><span id="k-breakfast" style="font-size: 12px; font-weight: 700;">0 kcal</span></div>
                <div class="drop-zone" id="z-breakfast"><p class="drop-placeholder">Drop Breakfast here</p></div>
            </div>

            <div class="meal-section" id="box-lunch" ondragover="hOver(event)" ondragleave="hLeave(event)" ondrop="hDrop(event, 'lunch')">
                <div class="meal-header"><h4>Lunch</h4><span id="k-lunch" style="font-size: 12px; font-weight: 700;">0 kcal</span></div>
                <div class="drop-zone" id="z-lunch"><p class="drop-placeholder">Drop Lunch here</p></div>
            </div>

            <div class="meal-section" id="box-dinner" ondragover="hOver(event)" ondragleave="hLeave(event)" ondrop="hDrop(event, 'dinner')">
                <div class="meal-header"><h4>Dinner</h4><span id="k-dinner" style="font-size: 12px; font-weight: 700;">0 kcal</span></div>
                <div class="drop-zone" id="z-dinner"><p class="drop-placeholder">Drop Dinner here</p></div>
            </div>

            <div class="meal-section" id="box-misc" ondragover="hOver(event)" ondragleave="hLeave(event)" ondrop="hDrop(event, 'misc')">
                <div class="meal-header"><h4>Misc / Snacks</h4><span id="k-misc" style="font-size: 12px; font-weight: 700;">0 kcal</span></div>
                <div class="drop-zone" id="z-misc"><p class="drop-placeholder">Drop Snacks here</p></div>
            </div>
        </div>
    </div>
</div>

<script>
    const circle = document.getElementById('progressCircle');
    const circumference = 2 * Math.PI * 62;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    let DB = [
        {name: 'Chicken Breast', kcal: 165}, {name: 'Boiled Eggs (2)', kcal: 140},
        {name: 'Avocado Toast', kcal: 220}, {name: 'Greek Yogurt', kcal: 120},
        {name: 'Oatmeal Cup', kcal: 150}, {name: 'Protein Shake', kcal: 140}
    ];

    function updateSearch() {
        const q = document.getElementById('foodSearch').value.toLowerCase();
        const res = document.getElementById('searchRes');
        if(!q) { res.innerHTML = ''; return; }
        res.innerHTML = DB.filter(f => f.name.toLowerCase().includes(q)).map(f => `
            <div class="draggable-food" draggable="true" ondragstart="onDrag(event, '${f.name}', ${f.kcal})">
                ${f.name} <span style="float:right; color:var(--accent); font-weight:700;">${f.kcal}</span>
            </div>
        `).join('');
    }

    function addCustom() {
        const name = document.getElementById('customName').value, kcal = parseInt(document.getElementById('customKcal').value);
        if(!name || !kcal) return;
        DB.unshift({name, kcal});
        document.getElementById('foodSearch').value = name;
        updateSearch();
    }

    function onDrag(e, name, kcal) {
        e.dataTransfer.setData('application/json', JSON.stringify({name, kcal}));
    }

    function hOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function hLeave(e) { e.currentTarget.classList.remove('drag-over'); }

    function hDrop(e, mealId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const data = JSON.parse(e.dataTransfer.getData('application/json'));
        const zone = document.getElementById('z-' + mealId);
        if(zone.querySelector('.drop-placeholder')) zone.innerHTML = '';

        const item = document.createElement('div');
        item.className = 'logged-item';
        item.dataset.kcal = data.kcal;
        item.innerHTML = `<span>${data.name} <b style="color:var(--accent); margin-left:8px">${data.kcal}</b></span>
                          <button class="remove-btn" onclick="removeItem(this, '${mealId}')">✕</button>`;
        zone.appendChild(item);
        calculate();
    }

    function removeItem(btn, mealId) {
        btn.parentElement.remove();
        const zone = document.getElementById('z-' + mealId);
        if(!zone.children.length) zone.innerHTML = `<p class="drop-placeholder">Drop ${mealId} here</p>`;
        calculate();
    }

    function calculate() {
        const goal = parseInt(document.getElementById('goalInput').value) || 2000;
        let total = 0;
        ['breakfast', 'lunch', 'dinner', 'misc'].forEach(m => {
            let mTotal = 0;
            document.querySelectorAll(`#z-${m} .logged-item`).forEach(i => mTotal += parseInt(i.dataset.kcal));
            document.getElementById('k-' + m).innerText = mTotal + ' kcal';
            total += mTotal;
        });

        const remaining = goal - total;
        document.getElementById('stripKcal').innerText = total;
        document.getElementById('kcalDisplay').innerText = Math.abs(remaining);
        document.getElementById('gaugeSub').innerText = remaining < 0 ? "Exceeded" : "Remaining";
        
        let pct = Math.min((total / goal) * 100, 100);
        circle.style.strokeDashoffset = circumference - (pct / 100) * circumference;
        circle.style.stroke = total > goal ? 'var(--danger)' : (total === goal ? 'var(--success)' : 'var(--accent)');
        document.getElementById('kcalPill').className = total > goal ? 'stat-pill over' : 'stat-pill';
    }
</script>
</body>
</html>
