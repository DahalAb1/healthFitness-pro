<!--
some more important information:
The Workout Timer is a high-intensity interval training (HIIT) tool designed for mobile-responsive performance.

Key Features
Three-Variable Configuration: Users can define Work duration, Rest duration, and the total number of Rounds.

Visual Phase Indicators:

Work Phase: Circle progress turns Green.

Rest Phase: Circle progress turns Blue (Accent).

Routine Persistence: A "Saved Routines" section allows users to store specific interval configurations 
(e.g., "20/10 x 8") as clickable pills for instant loading.

Technical Implementation
Timer Logic: Employs setInterval to decrement timeLeft. 
It automatically toggles the isWorkPhase boolean and increments the currentRound when the timer hits zero.

SVG Synchronization: The updateUI() function syncs the timer's digital readout with the SVG circle's visual stroke, 
ensuring the progress ring matches the remaining time linearly.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Pro | Timer</title>
    <style>
        :root {
            --background: #0F0F0F;
            --surface: #1A1A1A;
            --border: #333333;
            --accent: #4A90FF;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --success: #4AFF8C;
            --danger: #FF4A4A;
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--background); color: var(--text-primary); display: flex; justify-content: center; padding: 40px 0; min-height: 100vh; }

        .app-container { width: 90%; max-width: 420px; text-align: center; }

        .timer-header { margin-bottom: 30px; }
        .timer-header h1 { font-size: 2.2rem; letter-spacing: -1.5px; margin-bottom: 15px; font-weight: 800; }

        .stat-strip { display: inline-flex; gap: 10px; margin-bottom: 25px; }
        .stat-pill {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
            border-radius: 40px; padding: 8px 16px; font-size: 11px; font-weight: 800;
            color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;
        }
        .stat-pill.active { border-color: var(--success); color: var(--success); background: rgba(74, 255, 140, 0.05); }

        .timer-box { position: relative; width: 280px; height: 280px; margin: 0 auto 30px; }
        svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .circle-bg { fill: none; stroke: #252525; stroke-width: 6; }
        .circle-progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.2s linear, stroke 0.4s; }
        .timer-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .timer-content h1 { font-size: 4.5rem; font-weight: 900; letter-spacing: -3px; line-height: 1; }
        .timer-content p { font-size: 10px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; }

        .config-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; margin-bottom: 15px;
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
        }
        .input-group { text-align: left; }
        .input-group label { display: block; font-size: 8px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
        .input-field { background: #080808; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 10px; width: 100%; font-weight: 700; outline: none; font-size: 13px; }

        /* --- IMPROVED SAVE SECTION --- */
        .save-container { margin-bottom: 30px; }
        
        .action-pill-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(74, 144, 255, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 8px 20px; border-radius: 30px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: 0.2s; margin-bottom: 25px;
        }
        .action-pill-btn:hover { background: var(--accent); color: white; }

        .saved-label { 
            font-size: 10px; font-weight: 800; color: var(--text-secondary); 
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; 
            display: block; opacity: 0.6;
        }
        
        .saved-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        
        .saved-pill {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; border-radius: 30px; font-size: 11px; font-weight: 700;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
            color: var(--text-primary); cursor: pointer; transition: 0.2s;
        }
        .saved-pill:hover { border-color: var(--accent); background: rgba(74, 144, 255, 0.05); }
        
        .saved-pill .val-span { opacity: 0.9; }
        .saved-pill .delete-x {
            color: var(--text-secondary); font-size: 14px; padding-left: 5px; border-left: 1px solid var(--border);
            transition: 0.2s;
        }
        .saved-pill .delete-x:hover { color: var(--danger); }

        /* --- ACTION BUTTONS --- */
        .controls { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 18px; border-radius: 14px; font-weight: 800; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: 0.2s; border: 1px solid var(--border); }
        .btn-start { background: var(--accent); color: white; border: none; }
        .btn-reset { background: transparent; color: var(--danger); border-color: rgba(255, 74, 74, 0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="timer-header">
        <h1>Workout Timer</h1>
        <div class="stat-strip">
            <div class="stat-pill active" id="roundStat">Round 1 / 8</div>
            <div class="stat-pill" id="phaseStat">Ready</div>
        </div>
    </div>

    <div class="timer-box">
        <svg viewBox="0 0 160 160">
            <circle class="circle-bg" cx="80" cy="80" r="75"></circle>
            <circle id="progressCircle" class="circle-progress" cx="80" cy="80" r="75"></circle>
        </svg>
        <div class="timer-content">
            <h1 id="timeDisplay">00</h1>
            <p id="subText">Seconds</p>
        </div>
    </div>

    <div class="config-panel">
        <div class="input-group">
            <label>Work</label>
            <input type="number" id="workIn" class="input-field" value="40">
        </div>
        <div class="input-group">
            <label>Rest</label>
            <input type="number" id="restIn" class="input-field" value="20">
        </div>
        <div class="input-group">
            <label>Rounds</label>
            <input type="number" id="roundsIn" class="input-field" value="8">
        </div>
    </div>

    <div class="save-container">
        <div class="action-pill-btn" onclick="saveTimer()">+ Save Configuration</div>
        <span class="saved-label">My Routines</span>
        <div class="saved-list" id="savedList">
            <div class="saved-pill">
                <span class="val-span" onclick="loadTimer(20, 10, 8)">20/10 x 8</span>
                <div class="delete-x" onclick="this.parentElement.remove()">✕</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start Workout</button>
    </div>
</div>

<script>
    let timerInterval;
    let isRunning = false;
    let isWorkPhase = true;
    let currentRound = 1;
    let timeLeft = 0;

    const circle = document.getElementById('progressCircle');
    const circumference = 2 * Math.PI * 75;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    function updateUI() {
        const work = parseInt(document.getElementById('workIn').value) || 1;
        const rest = parseInt(document.getElementById('restIn').value) || 1;
        const totalRounds = parseInt(document.getElementById('roundsIn').value) || 1;
        
        const phaseTotal = isWorkPhase ? work : rest;
        document.getElementById('timeDisplay').innerText = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
        
        const offset = circumference - (timeLeft / phaseTotal) * circumference;
        circle.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
        circle.style.stroke = isWorkPhase ? "var(--success)" : "var(--accent)";
        
        document.getElementById('phaseStat').innerText = isWorkPhase ? "Work Phase" : "Rest Phase";
        document.getElementById('roundStat').innerText = `Round ${currentRound} / ${totalRounds}`;
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerInterval);
            document.getElementById('startBtn').innerText = "Resume";
        } else {
            if (timeLeft <= 0) timeLeft = parseInt(document.getElementById('workIn').value);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    const totalRounds = parseInt(document.getElementById('roundsIn').value);
                    if (isWorkPhase) {
                        isWorkPhase = false;
                        timeLeft = parseInt(document.getElementById('restIn').value);
                    } else {
                        if (currentRound >= totalRounds) {
                            clearInterval(timerInterval);
                            alert("Workout Complete!");
                            resetTimer();
                            return;
                        }
                        isWorkPhase = true;
                        currentRound++;
                        timeLeft = parseInt(document.getElementById('workIn').value);
                    }
                }
                updateUI();
            }, 1000);
            document.getElementById('startBtn').innerText = "Pause";
        }
        isRunning = !isRunning;
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        isWorkPhase = true;
        currentRound = 1;
        timeLeft = parseInt(document.getElementById('workIn').value);
        document.getElementById('startBtn').innerText = "Start Workout";
        updateUI();
    }

    function saveTimer() {
        const w = document.getElementById('workIn').value;
        const r = document.getElementById('restIn').value;
        const rnds = document.getElementById('roundsIn').value;
        const label = `${w}/${r} x ${rnds}`;
        
        const pill = document.createElement('div');
        pill.className = 'saved-pill';
        pill.innerHTML = `<span class="val-span" onclick="loadTimer(${w}, ${r}, ${rnds})">${label}</span>
                          <div class="delete-x" onclick="this.parentElement.remove()">✕</div>`;
        
        document.getElementById('savedList').appendChild(pill);
    }

    function loadTimer(w, r, rnds) {
        document.getElementById('workIn').value = w;
        document.getElementById('restIn').value = r;
        document.getElementById('roundsIn').value = rnds;
        resetTimer();
    }

    timeLeft = 40;
    updateUI();
</script>

</body>
</html>
