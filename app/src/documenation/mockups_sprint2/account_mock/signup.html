<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Hub | Pulse Pro</title>
    <style>
        :root {
            --bg: #080808;
            --card: #121212;
            --accent: #4A90FF;
            --secondary: #BC4AFF; /* Purple accent for variety */
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* The Animated Gradient Border */
        .outer-glow {
            position: relative;
            padding: 2px;
            border-radius: 24px;
            background: linear-gradient(45deg, var(--accent), var(--secondary), var(--accent));
            background-size: 200% 200%;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-card {
            background: var(--card);
            padding: 40px;
            border-radius: 22px;
            width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .signup-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .signup-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .field { margin-bottom: 20px; }
        
        .field label {
            display: block;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .field input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #252525;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .field input:focus {
            outline: none;
            border-color: var(--secondary);
            background: #222;
        }

        .submit-group { margin-top: 30px; }

        .btn-main {
            width: 100%;
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.02);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #444;
        }

        .login-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="outer-glow">
    <div class="signup-card">
        <h2>Unleash Potential.</h2>
        <p>Create your profile to start tracking.</p>

        <div class="field">
            <label>Identification</label>
            <input type="text" placeholder="Full Name">
        </div>

        <div class="field">
            <label>Digital Mail</label>
            <input type="email" placeholder="email@address.com">
        </div>

        <div class="field">
            <label>Secure Key</label>
            <input type="password" placeholder="••••••••">
        </div>

        <div class="submit-group">
            <button class="btn-main">Create Account</button>
        </div>

        <div class="login-link">
            Already a member? <a href="#">Sign In</a>
        </div>
    </div>
</div>

</body>
</html>
