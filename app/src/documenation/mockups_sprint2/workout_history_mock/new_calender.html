<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History - Health Fitness Pro</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        :root {
            --background: #0F0F0F;
            --surface: #1A1A1A;
            --border: #333333;
            --accent: #4A90FF;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--background); color: var(--text-primary); line-height: 1.6; }

        /* --- NAVIGATION --- */
        nav {
            height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 1000;
        }
        .Logo { font-weight: 800; font-size: 18px; color: white; text-decoration: none; text-transform: uppercase; }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        .login-btn { background: var(--accent); border: none; color: white; padding: 8px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* --- MODERN BACKGROUND HEADER --- */
        .feature-hero {
            position: relative;
            padding: 80px 10%;
            text-align: center;
            /* Added background image logic similar to custom_workout.html */
            background: linear-gradient(rgba(15, 15, 15, 0.8), rgba(15, 15, 15, 1)), 
                        url('calendar.webp'); 
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid var(--border);
        }
        .workout-history-heading { font-size: 2.8rem; letter-spacing: -2px; margin-bottom: 10px; font-weight: 900; }
        .workout-history-description { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        /* --- CALENDAR --- */
        .calendar-page {
            max-width: 1100px;
            margin: -40px auto 40px; /* Overlap with hero for modern look */
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .month-nav h2 { font-size: 1.5rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .month-nav button {
            background: #222;
            border: 1px solid var(--border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .day-header { 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            text-align: center;
            padding-bottom: 15px;
        }
        .calendar-day {
            aspect-ratio: 1;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .calendar-day:hover:not(.empty) { border-color: var(--accent); background: #1a1a1a; }
        .calendar-day.selected { border-color: var(--accent); background: rgba(74, 144, 255, 0.1); color: var(--accent); font-weight: 700; }
        .calendar-day.empty { background: transparent; border: none; cursor: default; }

        /* --- PROGRESS TRACKER --- */
        .progress-tracker {
            max-width: 1100px;
            margin: 0 auto 100px;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .time-filters {
            display: flex;
            gap: 5px;
            background: #0F0F0F;
            padding: 5px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }
        .filter-btn.active { background: var(--accent); color: white; }

        .chart-container {
            width: 100%;
            height: 400px;
            background: #0F0F0F;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <nav>
        <a class="Logo" href="../../front_page/index.html#home">Health Fitness Pro</a>
        <ul class="nav-links">
            <li><a href="../../front_page/index.html#workout-features">Workout</a></li>
            <li><a href="../../exercise-library.html">Library</a></li>
            <li><a href="../../front_page/index.html#page-calorie_tracker">Nutrition</a></li>
        </ul>
        <button class="login-btn">Login</button>
    </nav>

    <section class="workout-history-main">
        <div class="feature-hero">
            <h1 class="workout-history-heading">Workout History</h1>
            <p class="workout-history-description">Your fitness journey at a glance. Select a day to review specific session data or analyze trends below.</p>
        </div>

        <div class="calendar-page">
            <div class="month-nav">
                <button onclick="changeMonth(-1)">&lt;</button>
                <h2 id="monthDisplay"></h2>
                <button onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="month-grid" id="calendarGrid"></div>
            
            <section class="selected-day" id="selectedDaySection" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                <h3 id="selectedDateHeader" style="font-size: 1.1rem; color: var(--accent);">Select a date</h3>
                <div id="workoutDetails" style="margin-top: 10px; color: var(--text-secondary); font-size: 14px;">
                    No workout recorded for this date.
                </div>
            </section>
        </div>

        <section class="progress-tracker">
            <div class="progress-header">
                <h2 style="font-size: 1.4rem;">Performance Trends</h2>
                <div class="time-filters">
                    <button class="filter-btn" onclick="setFilter('day', this)">Day</button>
                    <button class="filter-btn" onclick="setFilter('week', this)">Week</button>
                    <button class="filter-btn active" onclick="setFilter('month', this)">Month</button>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
        </section>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let currentViewDate = new Date();

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const display = document.getElementById('monthDisplay');
            grid.innerHTML = '';

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            display.innerText = `${monthNames[currentViewDate.getMonth()]} ${currentViewDate.getFullYear()}`;

            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = d;
                grid.appendChild(h);
            });

            const firstDay = new Date(currentViewDate.getFullYear(), currentViewDate.getMonth(), 1).getDay();
            const daysInMonth = new Date(currentViewDate.getFullYear(), currentViewDate.getMonth() + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'calendar-day empty';
                grid.appendChild(empty);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';
                day.innerText = i;
                day.onclick = function() {
                    document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('selectedDateHeader').innerText = `${monthNames[currentViewDate.getMonth()]} ${i}, ${currentViewDate.getFullYear()}`;
                };
                grid.appendChild(day);
            }
        }

        function changeMonth(offset) {
            currentViewDate.setMonth(currentViewDate.getMonth() + offset);
            renderCalendar();
        }

        function setFilter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const ctx = document.getElementById('progressChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [{
                    label: 'Volume (lbs)',
                    data: [12000, 15500, 14000, 19000],
                    borderColor: '#4A90FF',
                    backgroundColor: 'rgba(74, 144, 255, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#222' }, ticks: { color: '#888' } },
                    x: { grid: { display: false }, ticks: { color: '#888' } }
                }
            }
        });

        renderCalendar();
    </script>
</body>
</html>
